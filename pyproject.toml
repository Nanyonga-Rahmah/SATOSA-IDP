[project]
name = "idp"
version = "0.1.0"
description = "SATOSA test IDP"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "pysaml2",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "dlint",
    "flake8-bandit",
    "flake8-bugbear",
    "flake8-comprehensions",
    "flake8-docstrings",
    "flake8-eradicate",
    "flake8-fixme",
    "flake8-future-import",
    "flake8-pytest-style",
    "flake8-requirements",
    "mypy",
    "pytest",
    "pre-commit",
    "build"
]

test = [
    "faker",
    "pytest",
    "pytest-cov",
    "pytest-emoji",
    "pytest-md",
    "pytest-order",
    "pytest-reportlog",
]

[tool.black]
line-length = 88
target-version = ["py311"]



[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = "saml2.*"
ignore_missing_imports = true

[tool.setuptools.package-data]
idp = ["certs/*", "metadata/*", "templates/*"]
